{{- /* "Since vX.Y.Z" from the page's front matter. v0.5.0 is the first
public release, so pages from v0.1 to v0.5 say nothing. */ -}}
{{- with .Params.since -}}
  {{- if not (in (slice "v0.1." "v0.2." "v0.3." "v0.4." "v0.5.") (substr . 0 5)) -}}
<p class="anetos-since">Since {{ . }}</p>
  {{- end -}}
{{- end -}}
